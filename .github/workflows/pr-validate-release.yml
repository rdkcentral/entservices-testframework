name: Shared PR - Validate Backport Target

# Reusable: github.event / github.repository / GITHUB_TOKEN all belong to the caller repo.
on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-release-version:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate backport_to
        env:
          PR_BODY:    ${{ github.event.pull_request.body }}
          PR_BRANCH:  ${{ github.event.pull_request.head.ref }}
          PR_TITLE:   ${{ github.event.pull_request.title }}
          PR_NUMBER:  ${{ github.event.pull_request.number }}
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_URL:   https://ccp.sys.comcast.net
        run: |
          set -euo pipefail
          
          echo "PR branch       : $PR_BRANCH"
          echo "PR number       : #$PR_NUMBER"
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  BACKPORT TARGET VALIDATION                                     ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""

          # ────────────────────────────────────────────────────────────────────
          # Rule 1: backport_to is OPTIONAL. If omitted entirely, treat as
          # 'no backport needed' rather than failing. If it appears more
          # than once, the LAST occurrence wins (not an error).
          # ────────────────────────────────────────────────────────────────────
          echo "▶ Rule 1: Checking for 'backport_to' field..."
          
          # grep -c exits 1 on zero matches; || true prevents pipefail from killing the script
          OCCURRENCE_COUNT=$(echo "$PR_BODY" | grep -ciE '^\s*backport_to\s*:' || true)

          if [ "$OCCURRENCE_COUNT" -eq 0 ]; then
            echo "  ℹ️  'backport_to:' not specified — treated as 'none' (no backport)."
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║  ✅ VALIDATION PASSED: NO BACKPORT (field omitted)              ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            exit 0
          fi
          
          if [ "$OCCURRENCE_COUNT" -gt 1 ]; then
            echo "  ℹ️  Multiple 'backport_to' fields found ($OCCURRENCE_COUNT) — using the LAST one."
            echo "$PR_BODY" | grep -inE '^\s*backport_to\s*:' | sed 's/^/    │ Line /' || true
          fi
          
          echo "  ✅ 'backport_to' field present"
          echo ""

          # ────────────────────────────────────────────────────────────────────
          # Rule 2: Extract and normalize the value (last occurrence wins).
          # Also supports comma-separated multiple targets, e.g.:
          #   backport_to: dummy_develop,8.3.4.0
          #   backport_to: support/8.6.3.0(RDKEMW-12345),8.7.0.0(RDKEMW-67890)
          # ────────────────────────────────────────────────────────────────────
          echo "▶ Rule 2: Extracting and normalizing value..."
          
          # Extract the LAST matching line (case-insensitive, flexible colon spacing)
          RAW_LINE=$(echo "$PR_BODY" | grep -iE '^\s*backport_to\s*:' | tail -1)
          echo "  Raw line: '$RAW_LINE'"
          
          # Extract value after colon (handle multi-line YAML format)
          # If value is empty after colon, check next non-empty line
          VALUE_ON_SAME_LINE=$(echo "$RAW_LINE" | sed -E 's/^[^:]*:\s*//' | sed 's/#.*//' | xargs || true)
          
          if [ -z "$VALUE_ON_SAME_LINE" ]; then
            # Multi-line YAML format: check next non-empty line
            echo "  ⚠️  Value not on same line, checking next line (multi-line YAML)..."
            LINE_NUM=$(echo "$PR_BODY" | grep -inE '^\s*backport_to\s*:' | tail -1 | cut -d: -f1)
            VALUE_ON_SAME_LINE=$(echo "$PR_BODY" | tail -n +$((LINE_NUM + 1)) | grep -v '^[[:space:]]*$' | head -1 | sed 's/#.*//' | xargs || true)
            echo "  Next line value: '$VALUE_ON_SAME_LINE'"
          fi
          
          # Strip leading/trailing spaces, newlines, carriage returns, and remove trailing comments
          VERSION=$(echo "$VALUE_ON_SAME_LINE" | sed 's/#.*//' | tr -d '\n\r' | xargs || true)
          
          echo "  Normalized value: '$VERSION'"
          echo ""

          # ────────────────────────────────────────────────────────────────────
          # Rule 2b: Empty value after parsing → nothing to do, not an error
          # (matches backport.yml, which skips on an empty backport_to)
          # ────────────────────────────────────────────────────────────────────
          if [ -z "$VERSION" ]; then
            echo "  ℹ️  backport_to field is empty — treated as 'none' (no backport)."
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║  ✅ VALIDATION PASSED: NO BACKPORT (empty value)                ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            exit 0
          fi

          # ────────────────────────────────────────────────────────────────────
          # Rule 3: Handle 'none' (no backport needed)
          # ────────────────────────────────────────────────────────────────────
          echo "▶ Rule 3: Checking if backport is needed..."
          
          if echo "$VERSION" | grep -qiE '^none$'; then
            echo "  ✅ backport_to: none — no backport needed for this PR."
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║  ✅ VALIDATION PASSED: NO BACKPORT                              ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            exit 0
          fi
          
          echo "  ℹ️  Backport required for version: $VERSION"
          echo ""

          # ────────────────────────────────────────────────────────────────────
          # Source ticket: the develop PR's own ticket, same regex backport.yml
          # uses. This is what gets cloned for any target left without its own
          # explicit (RDKEMW-xxxxx) annotation.
          # ────────────────────────────────────────────────────────────────────
          SOURCE_TICKET=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          if [ -z "$SOURCE_TICKET" ]; then
            SOURCE_TICKET=$(echo "$PR_BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          fi
          echo "  Source ticket: ${SOURCE_TICKET:-<none found>}"
          echo ""

          # ────────────────────────────────────────────────────────────────────
          # Clone the source ticket into a new Jira ticket for a given target
          # label (e.g. "8.6.3.0"). Only called when a target has no ticket of
          # its own. Fetches the source once and reuses it for every target.
          # ────────────────────────────────────────────────────────────────────
          SOURCE_FETCHED=false

          fetch_source_ticket() {
            [ "$SOURCE_FETCHED" = true ] && return 0

            echo "    ▶ Fetching source ticket $SOURCE_TICKET to clone..." >&2
            local resp http_code body
            resp=$(curl -sS -w '\n%{http_code}' --max-time 15 \
              -H "Authorization: Bearer $JIRA_TOKEN" -H "Accept: application/json" \
              "$JIRA_URL/rest/api/2/issue/$SOURCE_TICKET?fields=*all")
            http_code=$(tail -n1 <<<"$resp")
            body=$(sed '$d' <<<"$resp")

            if [ "$http_code" != "200" ]; then
              echo "    ❌ Could not fetch source ticket $SOURCE_TICKET (status $http_code)" >&2
              return 1
            fi

            echo "$body" > /tmp/source_issue.json
            SOURCE_PROJECT=$(jq -r '.fields.project.key' <<<"$body")
            SOURCE_SUMMARY=$(jq -r '.fields.summary' <<<"$body" | sed -E 's/^\[[^]]*\]\s*//')
            SOURCE_DESCRIPTION=$(jq -r '.fields.description // ""' <<<"$body")

            # Required fields for a standalone "Task" in this project — cloning
            # never reuses the source's own issue type (e.g. Sub-task needs a parent).
            curl -sS --max-time 15 -H "Authorization: Bearer $JIRA_TOKEN" -H "Accept: application/json" \
              "$JIRA_URL/rest/api/2/issue/createmeta?projectKeys=$SOURCE_PROJECT&expand=projects.issuetypes.fields" \
              | jq -c '.projects[0].issuetypes[]? | select(.name == "Task") | .fields | with_entries(.value |= {required, name, type: .schema.type})' \
              > /tmp/meta.json
            [ -s /tmp/meta.json ] || echo '{}' > /tmp/meta.json

            SOURCE_FETCHED=true
          }

          clone_jira_ticket() {
            local target_label="$1"
            fetch_source_ticket || return 1

            local new_title="[$target_label] $SOURCE_SUMMARY"

            # Copy whatever value the source ticket already has for each
            # required field — e.g. "Responsible Team" — instead of guessing.
            local extra
            extra=$(jq -n --slurpfile ref /tmp/source_issue.json --slurpfile meta /tmp/meta.json '
              ($ref[0]) as $ref | ($meta[0]) as $meta |
              def norm:
                if type == "array" then [.[] | if type == "object" then {id: .id} else . end]
                elif type == "object" then (if .id then {id: .id} elif .name then {name: .name} elif .value then {value: .value} else empty end)
                else . end;
              reduce ($meta | keys_unsorted[]) as $k ({};
                if (["project","issuetype","parent","summary","description","reporter"] | index($k)) then .
                elif (($meta[$k].required // false) | not) then .
                elif ($ref.fields[$k] // null) == null then .
                else . + {($k): ($ref.fields[$k] | norm)} end)')

            # Required text fields the source itself left blank get the new title.
            local filled
            filled=$(jq -n --arg summary "$new_title" --argjson meta "$(cat /tmp/meta.json)" --argjson extra "$extra" '
              reduce ($meta | to_entries[] | select(.value.required and .value.type == "string") | .key) as $k ({};
                if (["project","issuetype","parent","summary","description","reporter"] | index($k)) then .
                elif $extra[$k] != null then .
                else . + {($k): $summary} end)')

            local payload resp key
            payload=$(jq -n \
              --arg project "$SOURCE_PROJECT" --arg summary "$new_title" --arg desc "$SOURCE_DESCRIPTION" \
              --argjson extra "$extra" --argjson filled "$filled" \
              '{fields: ({project: {key: $project}, issuetype: {name: "Task"}, summary: $summary, description: $desc} + $extra + $filled)}')

            resp=$(curl -sS -X POST --max-time 15 \
              -H "Authorization: Bearer $JIRA_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
              --data "$payload" "$JIRA_URL/rest/api/2/issue")
            key=$(jq -r '.key // empty' <<<"$resp")

            if [ -z "$key" ]; then
              # Jira sometimes enforces a required field createmeta never listed —
              # if its error names the field(s), fill from the title and retry once.
              local missing retry_payload
              missing=$(jq -r '.errors // {} | keys | join(" ")' <<<"$resp")
              if [ -z "$missing" ]; then
                echo "    ❌ Failed to create ticket: $(jq -c . <<<"$resp")" >&2
                return 1
              fi

              echo "    ⚠️  Jira needs field(s) createmeta didn't list: $missing — retrying once" >&2
              retry_payload=$(jq -n --argjson base "$payload" --arg summary "$new_title" --arg keys "$missing" '
                $base | .fields += (reduce ($keys | split(" ") | map(select(length > 0))[]) as $k ({}; . + {($k): $summary}))')

              resp=$(curl -sS -X POST --max-time 15 \
                -H "Authorization: Bearer $JIRA_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
                --data "$retry_payload" "$JIRA_URL/rest/api/2/issue")
              key=$(jq -r '.key // empty' <<<"$resp")

              if [ -z "$key" ]; then
                echo "    ❌ Retry also failed: $(jq -c . <<<"$resp")" >&2
                return 1
              fi
            fi

            echo "    ✅ Cloned $SOURCE_TICKET → $key ($JIRA_URL/browse/$key)" >&2
            echo "$key"
          }

          # ────────────────────────────────────────────────────────────────────
          # Rule 4: Split comma-separated targets, validate each, map to branch.
          # 'none' is only valid on its own, not combined with real targets.
          # ────────────────────────────────────────────────────────────────────
          echo "▶ Rule 4: Validating target(s)..."
          echo "  Optional target ticket: branch(RDKEMW-12345); otherwise one is auto-created by cloning $SOURCE_TICKET."

          IFS=',' read -ra RAW_LIST <<< "$VERSION"
          CLEAN_LIST=()
          for v in "${RAW_LIST[@]}"; do
            v_trimmed=$(echo "$v" | xargs)
            [ -n "$v_trimmed" ] && CLEAN_LIST+=("$v_trimmed")
          done

          # Separators only (e.g. ",,,") leave no usable target — same as 'none'
          if [ "${#CLEAN_LIST[@]}" -eq 0 ]; then
            echo "  ℹ️  backport_to has no usable values — treated as 'none' (no backport)."
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════╗"
            echo "║  ✅ VALIDATION PASSED: NO BACKPORT (no usable values)           ║"
            echo "╚══════════════════════════════════════════════════════════════════╝"
            exit 0
          fi

          if [ "${#CLEAN_LIST[@]}" -gt 1 ]; then
            for v in "${CLEAN_LIST[@]}"; do
              if echo "$v" | grep -qiE '^none$'; then
                echo "  ❌ VALIDATION FAILED: 'none' cannot be combined with other targets ('$VERSION')"
                echo ""
                echo "  ┌─ VALID FORMAT ─────────────────────────────────────────────┐"
                echo "  │    backport_to: none                    → no backport needed│"
                echo "  │    backport_to: 8.3.4.0                 → single target     │"
                echo "  │    backport_to: dummy_develop,8.3.4.0   → multiple targets   │"
                echo "  └───────────────────────────────────────────────────────────┘"
                exit 1
              fi
            done
          fi

          SUPPORT_BRANCHES=()
          declare -A SEEN_BRANCHES=()
          OUTPUT_TOKENS=()
          BODY_CHANGED=false
          for v in "${CLEAN_LIST[@]}"; do
            target="$v"
            target_ticket=""
            if [[ "$v" == *'('* || "$v" == *')'* ]]; then
              if [[ "$v" =~ ^([^()]*)\((RDKEMW-[0-9]+)\)$ ]]; then
                target=$(echo "${BASH_REMATCH[1]}" | xargs)
                target_ticket="${BASH_REMATCH[2]}"
              else
                echo "  ❌ VALIDATION FAILED: Invalid target ticket in '$v' (expected branch(RDKEMW-12345))"
                exit 1
              fi
            fi

            if echo "$target" | grep -qiE '^(dummy_)?develop$'; then
              b=$(echo "$target" | tr '[:upper:]' '[:lower:]')
              echo "  ✅ '$v' accepted → branch: $b"
            elif echo "$target" | grep -qiE '^(support|release)/'; then
              # Already a full branch path (e.g. "support/8.6.3.0") — use as-is.
              b="$target"
              echo "  ✅ '$v' accepted as full branch path → branch: $b"
            elif echo "$target" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              IFS='.' read -ra PARTS <<< "$target"
              LEADING_ZERO=false
              for PART in "${PARTS[@]}"; do
                if [[ "$PART" =~ ^0[0-9]+ ]]; then
                  LEADING_ZERO=true
                fi
              done
              if [ "$LEADING_ZERO" = true ]; then
                echo "  ❌ VALIDATION FAILED: Version part has a leading zero in '$v'"
                echo ""
                echo "  ┌─ VALID FORMAT ─────────────────────────────────────────────┐"
                echo "  │    backport_to: none                    → no backport needed│"
                echo "  │    backport_to: 8.3.4.0                 → single target     │"
                echo "  │    backport_to: dummy_develop,8.3.4.0   → multiple targets   │"
                echo "  └───────────────────────────────────────────────────────────┘"
                exit 1
              fi
              if [ "${#PARTS[@]}" -eq 3 ]; then
                b="support/${target}.0"
              else
                b="support/${target}"
              fi
              echo "  ✅ '$v' accepted → branch: $b"
            elif git ls-remote --exit-code --heads origin "$target" > /dev/null 2>&1; then
              # Fallback: doesn't match any known shorthand, but an exact branch
              # with this name already exists on origin — accept it literally.
              b="$target"
              echo "  ✅ '$v' accepted as existing branch → branch: $b"
            else
              echo "  ❌ VALIDATION FAILED: Invalid backport_to value '$v'"
              echo ""
              echo "  ┌─ VALID FORMAT ─────────────────────────────────────────────┐"
              echo "  │    backport_to: none                    → no backport needed│"
              echo "  │    backport_to: 8.3.4.0                 → single target     │"
              echo "  │    backport_to: dummy_develop,8.3.4.0   → multiple targets   │"
              echo "  └───────────────────────────────────────────────────────────┘"
              exit 1
            fi
            if [[ -v SEEN_BRANCHES[$b] ]]; then
              if [ "${SEEN_BRANCHES[$b]}" != "$target_ticket" ]; then
                echo "  ❌ VALIDATION FAILED: Conflicting tickets for target '$b'"
                exit 1
              fi
              echo "  ℹ️  Duplicate target '$b' ignored"
              OUTPUT_TOKENS+=("$v")
              continue
            fi
            SEEN_BRANCHES[$b]="$target_ticket"
            SUPPORT_BRANCHES+=("$b")
            if [ -n "$target_ticket" ]; then
              echo "  ✅ Ticket for $b: $target_ticket (feature/$target_ticket)"
              OUTPUT_TOKENS+=("$v")
            else
              echo "  ℹ️  No ticket given for $b — cloning from $SOURCE_TICKET"
              target_ticket=$(clone_jira_ticket "$target")
              if [ -z "$target_ticket" ]; then
                echo "  ❌ VALIDATION FAILED: Could not create a Jira ticket for target '$b'"
                exit 1
              fi
              SEEN_BRANCHES[$b]="$target_ticket"
              OUTPUT_TOKENS+=("${target}(${target_ticket})")
              BODY_CHANGED=true
            fi
          done
          echo ""

          # ────────────────────────────────────────────────────────────────────
          # Persist any newly-created tickets into the PR body itself, using the
          # same branch(TICKET) syntax a user would type manually. backport.yml
          # reads this body unchanged later — no other file needs to change.
          # ────────────────────────────────────────────────────────────────────
          if [ "$BODY_CHANGED" = true ]; then
            NEW_VERSION=$(IFS=,; echo "${OUTPUT_TOKENS[*]}")
            LABEL_PREFIX=$(echo "$RAW_LINE" | grep -oiE '^\s*backport_to\s*:\s*')
            NEW_LINE="${LABEL_PREFIX}${NEW_VERSION}"
            NEW_BODY="${PR_BODY//$RAW_LINE/$NEW_LINE}"

            echo "▶ Writing newly-created ticket(s) back into the PR description..."
            gh pr edit "$PR_NUMBER" --body "$NEW_BODY"
            echo "  ✅ PR body updated: backport_to: $NEW_VERSION"
            echo ""
          fi

          # ────────────────────────────────────────────────────────────────────
          # Rule 5: Verify every target branch exists on remote
          # ────────────────────────────────────────────────────────────────────
          echo "▶ Rule 5: Verifying target branch(es) exist on remote..."
          echo "  (This catches configuration errors BEFORE merge)"
          
          git fetch origin 2>/dev/null || true

          for b in "${SUPPORT_BRANCHES[@]}"; do
            if git ls-remote --exit-code --heads origin "$b" > /dev/null 2>&1; then
              echo "  ✅ Target branch found: $b"
            else
              echo "  ❌ VALIDATION FAILED: Branch '$b' does NOT exist on remote."
              echo ""
              echo "    Available support/release branches:"
              git branch -r | grep -E 'origin/(support|release)/' | sed 's/.*origin\//      /' || echo "      (none found)"
              echo ""
              echo "  ┌─ VALID FORMAT ─────────────────────────────────────────────┐"
              echo "  │    backport_to: none                    → no backport needed│"
              echo "  │    backport_to: 8.3.4.0                 → single target     │"
              echo "  │    backport_to: dummy_develop,8.3.4.0   → multiple targets   │"
              echo "  └───────────────────────────────────────────────────────────┘"
              echo ""
              echo "  → Fix: change 'backport_to' to an existing branch, or ask a maintainer to create '$b'."
              exit 1
            fi
          done
          echo ""

          # ────────────────────────────────────────────────────────────────────
          # SUCCESS
          # ────────────────────────────────────────────────────────────────────
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  ✅ VALIDATION PASSED                                           ║"
          echo "╠══════════════════════════════════════════════════════════════════╣"
          echo "║  backport_to   : $VERSION"
          echo "║  Target branch(es): ${SUPPORT_BRANCHES[*]}"
          echo "║                                                                  ║"
          echo "║  When this PR merges → automatic backport(s) will be created    ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
