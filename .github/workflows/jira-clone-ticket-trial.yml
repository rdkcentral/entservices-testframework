name: Jira Clone Ticket (Trial)

on:
  # TEMP: lets this run via plain push while the file only exists on this
  # branch — workflow_dispatch can't be invoked via API until this is on
  # the default branch. Remove this trigger once that's no longer needed.
  push:
    branches: [feature/RDKEMW-26905]
  workflow_dispatch:
    inputs:
      source_ticket:
        description: "Existing ticket to clone from (e.g. RDKEMW-12345)"
        required: true
      target_branch:
        description: "Backport target branch (e.g. support/8.6.3.0)"
        required: true
      label_override:
        description: "Optional label for the new title, e.g. '8.6'. Leave empty to derive from target_branch"
        required: false
        default: ""
      dry_run:
        description: "If true, only print what would be created"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  clone-ticket:
    runs-on: ubuntu-latest
    env:
      JIRA_URL: https://ccp.sys.comcast.net
    steps:

      - name: Derive label from target branch
        id: label
        env:
          # Hardcoded trial defaults used while inputs.* is empty (plain push event)
          TARGET_BRANCH:  ${{ inputs.target_branch || 'support/8.6.3.0' }}
          LABEL_OVERRIDE: ${{ inputs.label_override }}
        run: |
          set -euo pipefail

          if [ -n "$LABEL_OVERRIDE" ]; then
            LABEL="$LABEL_OVERRIDE"
          else
            # support/8.6.3.0 -> 8.6.3.0 (full version, no truncation)
            LABEL=$(echo "$TARGET_BRANCH" | sed -E 's#^(support|release)/##')
          fi

          echo "Derived label: [$LABEL]"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Fetch source ticket
        id: source
        env:
          JIRA_TOKEN:    ${{ secrets.JIRA_TOKEN }}
          SOURCE_TICKET: ${{ inputs.source_ticket || 'RDKEMW-22693' }}
        run: |
          set -euo pipefail

          if [ -z "${JIRA_TOKEN:-}" ]; then
            echo "❌ JIRA_TOKEN secret is not set" >&2
            exit 1
          fi

          echo "▶ Fetching $SOURCE_TICKET ..."
          # fields=*all so we have every custom field available to copy later,
          # not just the ones we already know we need.
          RESP=$(curl -sS -w '\n%{http_code}' --max-time 15 \
            -H "Authorization: Bearer $JIRA_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_URL/rest/api/2/issue/$SOURCE_TICKET?fields=*all")

          HTTP_CODE=$(tail -n1 <<<"$RESP")
          BODY=$(sed '$d' <<<"$RESP")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Could not fetch $SOURCE_TICKET (status $HTTP_CODE)" >&2
            echo "$BODY" >&2
            exit 1
          fi

          PROJECT_KEY=$(jq -r '.fields.project.key' <<<"$BODY")
          ISSUE_TYPE=$(jq -r '.fields.issuetype.name' <<<"$BODY")
          SUMMARY=$(jq -r '.fields.summary' <<<"$BODY")
          DESCRIPTION=$(jq -r '.fields.description // ""' <<<"$BODY")

          echo "  Project    : $PROJECT_KEY"
          echo "  Issue type : $ISSUE_TYPE"
          echo "  Summary    : $SUMMARY"

          echo "$BODY" > /tmp/source_issue.json
          echo "project_key=$PROJECT_KEY"   >> "$GITHUB_OUTPUT"
          echo "issue_type=$ISSUE_TYPE"     >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "description<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build cloned title
        id: title
        env:
          SOURCE_SUMMARY: ${{ steps.source.outputs.summary }}
          LABEL:          ${{ steps.label.outputs.label }}
        run: |
          set -euo pipefail

          # Strip any existing leading "[...]" tag (e.g. "[develop] ") before re-tagging.
          STRIPPED=$(echo "$SOURCE_SUMMARY" | sed -E 's/^\[[^]]*\]\s*//')
          NEW_TITLE="[$LABEL] $STRIPPED"

          echo "New title: $NEW_TITLE"
          echo "title=$NEW_TITLE" >> "$GITHUB_OUTPUT"

      # ── Discover which fields this project+issuetype actually requires ──────
      - name: Discover required fields for target issue type
        id: meta
        env:
          JIRA_TOKEN:  ${{ secrets.JIRA_TOKEN }}
          PROJECT_KEY: ${{ steps.source.outputs.project_key }}
          ISSUE_TYPE:  "Task"
        run: |
          set -euo pipefail

          api() {
            curl -sS --max-time 15 -H "Authorization: Bearer $JIRA_TOKEN" -H "Accept: application/json" "$JIRA_URL$1"
          }

          echo "▶ Looking up createmeta for $PROJECT_KEY / $ISSUE_TYPE ..."

          api "/rest/api/2/issue/createmeta?projectKeys=$PROJECT_KEY&expand=projects.issuetypes.fields" > /tmp/meta_raw.json

          jq -e --arg itype "$ISSUE_TYPE" \
            '.projects[0].issuetypes[]? | select(.name == $itype)' \
            /tmp/meta_raw.json > /tmp/task_meta.json 2>/dev/null || true

          if [ -s /tmp/task_meta.json ]; then
            jq -c '.fields | with_entries(.value |= {required, name, type: .schema.type})' \
              /tmp/task_meta.json > /tmp/meta.json
          else
            echo "  (classic createmeta had no fields — trying per-project issuetypes endpoint)"
            api "/rest/api/2/issue/createmeta/$PROJECT_KEY/issuetypes?maxResults=200" > /tmp/types.json
            TYPE_ID=$(jq -r --arg itype "$ISSUE_TYPE" '.values[]? | select(.name == $itype) | .id' /tmp/types.json | head -1)

            if [ -z "$TYPE_ID" ]; then
              echo "::warning::Could not resolve issue type id for '$ISSUE_TYPE' in $PROJECT_KEY"
              echo '{}' > /tmp/meta.json
            else
              api "/rest/api/2/issue/createmeta/$PROJECT_KEY/issuetypes/$TYPE_ID?maxResults=200" > /tmp/meta_raw2.json
              jq -c '[.values[]? | {key: (.fieldId // .key), value: {required: .required, name: .name, type: .schema.type}}] | from_entries' \
                /tmp/meta_raw2.json > /tmp/meta.json
            fi
          fi

          echo "  Required fields for $ISSUE_TYPE in $PROJECT_KEY:"
          jq -r 'to_entries[] | select(.value.required) | "    \(.key) (\(.value.name))"' /tmp/meta.json

      # ── Copy the source ticket's own values for whatever is required ────────
      - name: Copy required field values from source ticket
        id: extra
        run: |
          set -euo pipefail

          REF_EXTRA=$(jq -n --slurpfile ref /tmp/source_issue.json --slurpfile meta /tmp/meta.json '
            ($ref[0]) as $ref | ($meta[0]) as $meta |
            def norm:
              if type == "array" then [.[] | if type == "object" then {id: .id} else . end]
              elif type == "object" then (if .id then {id: .id} elif .name then {name: .name} elif .value then {value: .value} else empty end)
              else . end;
            reduce ($meta | keys_unsorted[]) as $k ({};
              if ((["project","issuetype","parent","summary","description","reporter"] | index($k)) != null) then .
              elif (($meta[$k].required // false) | not) then .
              elif ($ref.fields[$k] // null) == null then .
              else . + {($k): ($ref.fields[$k] | norm)} end)')

          echo "  Copied from source for required fields:"
          jq . <<<"$REF_EXTRA"

          {
            echo "fields<<EOF"
            echo "$REF_EXTRA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create cloned ticket
        env:
          JIRA_TOKEN:  ${{ secrets.JIRA_TOKEN }}
          PROJECT_KEY: ${{ steps.source.outputs.project_key }}
          # Always a standalone Task, regardless of the source ticket's own type
          # (e.g. Sub-task), since a clone has no parent to attach to.
          ISSUE_TYPE:  "Task"
          NEW_TITLE:   ${{ steps.title.outputs.title }}
          DESCRIPTION: ${{ steps.source.outputs.description }}
          EXTRA_FIELDS: ${{ steps.extra.outputs.fields }}
          # TEMP: one real demo creation, as explicitly requested — revert to 'true' right after
          DRY_RUN:     ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          # Required fields the source ticket left blank (nothing to copy) get
          # filled with the new summary, same fallback create-jira-subtasks.sh uses.
          TEXT_FALLBACK_KEYS=$(jq -rn --argjson extra "$EXTRA_FIELDS" --slurpfile meta /tmp/meta.json '
            [$meta[0] | to_entries[]
             | select(.value.required and .value.type == "string")
             | . as $e
             | select(["project","issuetype","parent","summary","description","reporter"] | index($e.key) | not)
             | select($extra[$e.key] == null)
             | $e.key] | join(" ")')

          if [ -n "$TEXT_FALLBACK_KEYS" ]; then
            echo "  Required text field(s) left blank by source — filling with summary: $TEXT_FALLBACK_KEYS"
          fi

          FILLED=$(jq -n --arg summary "$NEW_TITLE" --arg keys "$TEXT_FALLBACK_KEYS" '
            reduce ($keys | split(" ") | map(select(length > 0))[]) as $k ({}; . + {($k): $summary})')

          PAYLOAD=$(jq -n \
            --arg project "$PROJECT_KEY" \
            --arg itype   "$ISSUE_TYPE" \
            --arg summary "$NEW_TITLE" \
            --arg desc    "$DESCRIPTION" \
            --argjson extra "$EXTRA_FIELDS" \
            --argjson filled "$FILLED" \
            '{fields: ({project: {key: $project}, issuetype: {name: $itype}, summary: $summary, description: $desc} + $extra + $filled)}')

          echo "▶ Payload to create:"
          jq . <<<"$PAYLOAD"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "DRY_RUN=true — not creating. Re-run with dry_run=false to actually clone."
            exit 0
          fi

          RESP=$(curl -sS -X POST --max-time 15 \
            -H "Authorization: Bearer $JIRA_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_URL/rest/api/2/issue")

          KEY=$(jq -r '.key // empty' <<<"$RESP")

          # Jira's createmeta doesn't always expose every required field (seen
          # with customfield_11643 here) — if Jira's own error response names
          # still-missing fields, fill them from the summary and retry once.
          if [ -z "$KEY" ]; then
            STILL_MISSING=$(jq -r '.errors // {} | keys | join(" ")' <<<"$RESP")

            if [ -z "$STILL_MISSING" ]; then
              echo "❌ Failed to create cloned ticket" >&2
              jq . <<<"$RESP" >&2 2>/dev/null || echo "$RESP" >&2
              exit 1
            fi

            echo "  ⚠️  Jira reported still-missing field(s) not caught by createmeta: $STILL_MISSING"
            echo "  Retrying once, filled from summary..."

            RETRY_FILLED=$(jq -n --arg summary "$NEW_TITLE" --arg keys "$STILL_MISSING" '
              reduce ($keys | split(" ") | map(select(length > 0))[]) as $k ({}; . + {($k): $summary})')

            RETRY_PAYLOAD=$(jq -n --argjson base "$PAYLOAD" --argjson retry "$RETRY_FILLED" \
              '$base | .fields += $retry')

            echo "▶ Retry payload:"
            jq . <<<"$RETRY_PAYLOAD"

            RESP=$(curl -sS -X POST --max-time 15 \
              -H "Authorization: Bearer $JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data "$RETRY_PAYLOAD" \
              "$JIRA_URL/rest/api/2/issue")

            KEY=$(jq -r '.key // empty' <<<"$RESP")

            if [ -z "$KEY" ]; then
              echo "❌ Retry also failed to create cloned ticket" >&2
              jq . <<<"$RESP" >&2 2>/dev/null || echo "$RESP" >&2
              exit 1
            fi
          fi

          echo "✅ Created: $KEY"
          echo "   $JIRA_URL/browse/$KEY"
